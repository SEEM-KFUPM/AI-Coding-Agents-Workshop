name: Validate Workshop Structure

on:
  push:
  pull_request:

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required public files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "CONTRIBUTING.md"
            "presentation/slides.md"
            "presentation/README.md"
            "docs/setup/local-setup.md"
            "docs/agents/prompt-cheatsheet.md"
            "docs/reproducibility/git-workflow.md"
            "demos/README.md"
            "demos/demo1.pdf"
            "demos/demo2.pdf"
            "exercises/01-legacy-figure-reproduction/README.md"
            "exercises/02-paper-results-reproduction/README.md"
            "exercises/03-geoscience-webapp/README.md"
            "template/README.md"
          )
          for path in "${required[@]}"; do
            test -f "$path"
          done

      - name: Check projects file contract
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            "exercises/01-legacy-figure-reproduction"
            "exercises/02-paper-results-reproduction"
            "exercises/03-geoscience-webapp"
            "template"
          )
          for project in "${projects[@]}"; do
            test -f "$project/README.md"
            test -f "$project/input/TASK.md"
            test -f "$project/input/DATA.md"
            test -f "$project/input/OUTPUTS.md"
            test -f "$project/input/MILESTONES.md"
            test -f "$project/prompts.md"
          done
